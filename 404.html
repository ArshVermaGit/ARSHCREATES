<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Arsh Verma Portfolio</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .error-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
        }
        
        .error-container {
            text-align: center;
            max-width: 700px;
            z-index: 2;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .error-icon {
            font-size: 8rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }
        
        .error-code {
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--text-primary), var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        
        .error-title {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .error-message {
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.7;
        }
        
        .error-actions {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        
        .popular-pages {
            margin-top: 3rem;
        }
        
        .popular-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .popular-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            text-decoration: none;
            transition: all var(--transition-smooth);
            backdrop-filter: var(--glass-blur);
        }
        
        .popular-link:hover {
            background: var(--glass-bg);
            border-color: var(--accent);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-background"></div>

        <div class="error-container">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>

            <h1 class="error-code">404</h1>

            <h2 class="error-title">Oops! Page Not Found</h2>

            <p class="error-message">
                The page you're looking for seems to have wandered off into the digital void. 
                Don't worry though, we'll help you find your way back!
            </p>

            <div class="error-actions">
                <a href="index.html" class="btn btn-primary btn-glow">
                    <i class="fas fa-home"></i>
                    <span>Go Home</span>
                </a>
                <button class="btn btn-glass" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
            </div>

            <div class="popular-pages">
                <h3>Popular Pages:</h3>
                <div class="popular-links">
                    <a href="index.html#games" class="popular-link">
                        <i class="fas fa-gamepad"></i>
                        <span>Games Portfolio</span>
                    </a>
                    <a href="index.html#websites" class="popular-link">
                        <i class="fas fa-laptop-code"></i>
                        <span>Web Projects</span>
                    </a>
                    <a href="index.html#apps" class="popular-link">
                        <i class="fas fa-mobile-alt"></i>
                        <span>Mobile Apps</span>
                    </a>
                    <a href="index.html#contact" class="popular-link">
                        <i class="fas fa-envelope"></i>
                        <span>Contact Me</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add any 404-specific JavaScript here
        });
    </script>
</body>
</html>
