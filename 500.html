<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Arsh Verma Portfolio</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .error-container {
            text-align: center;
            max-width: 700px;
            z-index: 2;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .error-icon {
            font-size: 8rem;
            color: var(--error);
            margin-bottom: 2rem;
            animation: serverError 2s ease-in-out infinite;
        }
        
        @keyframes serverError {
            0%, 100% { 
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
            25% { 
                transform: rotate(-10deg) scale(1.1);
                opacity: 0.8;
            }
            50% { 
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
            75% { 
                transform: rotate(10deg) scale(1.1);
                opacity: 0.8;
            }
        }
        
        .error-code {
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--error), #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        
        .error-title {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .error-message {
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.7;
        }
        
        .error-actions {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .retry-counter {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            backdrop-filter: var(--glass-blur);
        }
        
        .retry-text {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-icon">
                <i class="fas fa-server"></i>
            </div>

            <h1 class="error-code">500</h1>

            <h2 class="error-title">Internal Server Error</h2>

            <p class="error-message">
                Something went wrong on our end. Our servers are having a moment, 
                but we're working hard to fix it. Please try again shortly.
            </p>

            <div class="error-actions">
                <a href="index.html" class="btn btn-primary btn-glow">
                    <i class="fas fa-home"></i>
                    <span>Go Home</span>
                </a>
                <button class="btn btn-glass" onclick="location.reload()">
                    <i class="fas fa-redo"></i>
                    <span>Try Again</span>
                </button>
            </div>

            <div class="retry-counter">
                <p class="retry-text">
                    <i class="fas fa-sync-alt fa-spin"></i>
                    Auto-retrying in <span id="retrySeconds">10</span> seconds...
                </p>
            </div>
        </div>
    </div>

    <script>
        let retrySeconds = 10;
        const retryInterval = setInterval(function() {
            retrySeconds--;
            document.getElementById('retrySeconds').textContent = retrySeconds;
            
            if (retrySeconds <= 0) {
                clearInterval(retryInterval);
                location.reload();
            }
        }, 1000);
        
        // Prevent auto-retry if user takes action
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                clearInterval(retryInterval);
            });
        });
    </script>
</body>
</html>
