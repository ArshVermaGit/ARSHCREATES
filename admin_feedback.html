<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Arsh Verma</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="admin_feedback.html" class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>Admin Panel</span>
                </a>
                <div class="nav-actions">
                    <button id="themeToggle" class="btn-icon">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="index.html" class="btn btn-outline btn-sm">
                        <i class="fas fa-home"></i>
                        <span>View Site</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
            <button id="refreshBtn" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i>
                <span>Refresh</span>
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: #3B82F6;">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="totalMessages">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10B981;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-label">Read</div>
                    <div class="stat-value" id="readMessages">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: #F59E0B;">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-label">Unread</div>
                    <div class="stat-value" id="unreadMessages">0</div>
                </div>
            </div>
        </div>

        <!-- Feedback List -->
        <div class="admin-panel">
            <div class="panel-header">
                <h2><i class="fas fa-comments"></i> Feedback Messages</h2>
                <div class="panel-actions">
                    <input type="text" id="searchInput" placeholder="Search messages..." class="search-input">
                    <button id="clearAllBtn" class="btn btn-outline btn-sm">
                        <i class="fas fa-trash"></i>
                        <span>Clear All</span>
                    </button>
                </div>
            </div>

            <div id="feedbackList" class="feedback-list">
                <!-- Messages will be loaded here -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-inbox"></i>
                <h3>No Messages</h3>
                <p>Contact form submissions will appear here</p>
            </div>
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div id="messageModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <button class="modal-close" id="closeModal">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-header">
                <h2>Message Details</h2>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Message details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button id="deleteMessageBtn" class="btn btn-outline">
                    <i class="fas fa-trash"></i>
                    <span>Delete</span>
                </button>
                <button id="markReadBtn" class="btn btn-primary">
                    <i class="fas fa-check"></i>
                    <span>Mark as Read</span>
                </button>
            </div>
        </div>
    </div>

    <div id="notificationContainer"></div>

    <script src="js/admin.js"></script>
</body>
</html>
